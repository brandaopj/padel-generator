name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-unit
          path: allure-results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  e2e-tests:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build app
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Check bundle size
        run: |
          FILE=$(ls dist/assets/index-*.js | head -1)
          SIZE=$(gzip -c "$FILE" | wc -c)
          echo "Bundle size: ${SIZE} bytes gzipped"
          if [ "$SIZE" -gt 307200 ]; then
            echo "Bundle too large: ${SIZE} bytes (limit: 307200)"
            exit 1
          fi

      - name: Run e2e tests against preview server
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-e2e
          path: allure-results-e2e/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

  report-failure:
    needs: [lint, unit-tests, e2e-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.lint.result == 'failure' || needs.unit-tests.result == 'failure' || needs.e2e-tests.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment on CI failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LABEL="ci-failure"
          TITLE="CI failure on main"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"

          FAILED=""
          [ "${{ needs.lint.result }}" = "failure" ] && FAILED="${FAILED}- Lint\n"
          [ "${{ needs.unit-tests.result }}" = "failure" ] && FAILED="${FAILED}- Unit tests\n"
          [ "${{ needs.e2e-tests.result }}" = "failure" ] && FAILED="${FAILED}- E2E tests\n"

          BODY=$(printf "## CI failed on [\`%s\`](%s/%s/commit/%s)\n\n**Failed jobs:**\n%s\n**Run:** %s" \
            "$SHORT_SHA" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "$COMMIT" \
            "$FAILED" \
            "$RUN_URL")

          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing issue #${EXISTING}"
          else
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABEL"
            echo "Created new CI failure issue"
          fi

  resolve-failure:
    needs: [lint, unit-tests, e2e-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.e2e-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close ci-failure issue if tests are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LABEL="ci-failure"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"

          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "All tests passed on [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT}). Closing automatically. Run: ${RUN_URL}"
            gh issue close "$EXISTING"
            echo "Closed issue #${EXISTING}"
          else
            echo "No open ci-failure issue found — nothing to close"
          fi

  deploy:
    needs: [lint, unit-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_BltyTKiCo95ymDu8zrWcKm3y
          VERCEL_PROJECT_ID: prj_4JxNKxvg21mH41MxktVdKkzK4vpu

  publish-report:
    needs: [lint, unit-tests, e2e-tests]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: allure-results-unit
          path: allure-input/
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-input/
        continue-on-error: true

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-input --clean -o allure-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - id: deployment
        uses: actions/deploy-pages@v4
