name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-unit
          path: allure-results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Run e2e tests against preview server
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-e2e
          path: allure-results-e2e/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

  report-failure:
    needs: [unit-tests, e2e-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.unit-tests.result == 'failure' || needs.e2e-tests.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Build failure summary
        id: summary
        run: |
          FAILED=""
          [ "${{ needs.unit-tests.result }}" = "failure" ] && FAILED="${FAILED}- Unit tests\n"
          [ "${{ needs.e2e-tests.result }}" = "failure" ] && FAILED="${FAILED}- E2E tests\n"
          echo "failed_jobs<<EOF" >> $GITHUB_OUTPUT
          printf "$FAILED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or comment on CI failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LABEL="ci-failure"
          TITLE="CI failure on main"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"
          FAILED_JOBS="${{ steps.summary.outputs.failed_jobs }}"

          BODY="## CI failed on [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT})

          **Failed jobs:**
          ${FAILED_JOBS}
          **Run:** ${RUN_URL}"

          # Check for existing open issue with this label
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing issue #${EXISTING}"
          else
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABEL"
            echo "Created new CI failure issue"
          fi

  resolve-failure:
    needs: [unit-tests, e2e-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.unit-tests.result == 'success' &&
      needs.e2e-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close ci-failure issue if tests are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LABEL="ci-failure"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"

          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "All tests passed on [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT}). Closing automatically. Run: ${RUN_URL}"
            gh issue close "$EXISTING"
            echo "Closed issue #${EXISTING}"
          else
            echo "No open ci-failure issue found — nothing to close"
          fi

  publish-report:
    needs: [unit-tests, e2e-tests]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: allure-results-unit
          path: allure-input/
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-input/
        continue-on-error: true

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-input --clean -o allure-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - id: deployment
        uses: actions/deploy-pages@v4
